[package]
name = "markcraft"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A local-first Markdown writing desk for Windows"

[[bin]]
name = "MarkCraft"
path = "src/main.rs"

[dependencies]
tao = "0.34.5"
wry = { version = "0.54.2", default-features = false, features = ["protocol", "drag-drop", "os-webview"] }
pulldown-cmark = "0.13"
html5ever = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false }
tempfile = "3"
latex2mathml = "0.2"
open = "5"
url = "2"
sha2 = "0.10"
base64 = "0.22"
percent-encoding = "2"

windows = { version = "0.61", features = ["Win32_Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging","Win32_Storage_FileSystem"] }
webview2-com = "0.38.2"
